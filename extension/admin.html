<!doctype html>
<!-- SOW-036/038: the GBTI extension's Admin page, inside the shared member-hub shell (top bar + left rail injected
     by shell.mjs). Reached from the avatar menu's "Admin tools" entry (shown only for moderator+).

     sow-228: THE STAFF SURFACE LIVES IN AN INERT <template> AND IS CLONED IN ONLY FOR A RESOLVED STAFF ROLE.
     This comment used to say opening the page "is harmless for a plain member" because <gbti-admin> self-gates.
     That was true when the page mounted ONE panel; it grew to EIGHT and only that one ever self-gated, so the
     sentence outlived the behaviour it described and the page shipped ungated. The nav link was hidden by
     [data-admin-only] the whole time: we hid the entrance and never locked the door.

     The panels are in a <template> rather than merely hidden because template content is INERT by spec -- it does
     not render and its custom elements do NOT upgrade -- so for a non-staff visitor no panel ever mounts and no
     admin request is ever issued. `display:none` would still ship the markup and still fire every load.

     THE CLIENT GATE IS DISCLOSURE CONTROL, NOT THE BOUNDARY. The Worker's authorizeStaff/authorizeAdmin, the
     SOW-005 gate and CODEOWNERS remain the authority. Adding a panel here does NOT make it safe: put it inside
     the template, and give it a server-side check of its own. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · GBTI Network</title>
  <!-- No-flash theme: external (not inline) because MV3 extension_pages CSP forbids inline scripts. -->
  <script src="dist/theme-init.js"></script>
  <link rel="stylesheet" href="shell.css" />
  <style>
    .hub-h { font-family: var(--f-display); font-weight: 800; font-size: 24px; letter-spacing: -.02em; margin: 0; }
    .hub-sub { color: var(--fg-mute); font-size: 14px; margin: 4px 0 0; }
    .hub-h2 { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: -.01em; margin: 28px 0 12px; }
    /* SOW-070: settings-style cards per admin section (cohesive with the member Settings page; frosts in Glass). */
    .admin-col { max-width: 1720px; margin: 0 auto; display: flex; flex-direction: column; } /* SOW-100: the categories workspace uses the full width (was 880px for the single-column managers) */
    .admin-card { border: 1.5px solid var(--line); border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.05); background: var(--paper); margin: 0 0 22px; overflow: hidden; -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }
    .admin-card-h { padding: 20px 24px 16px; }
    .admin-card-h h2 { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: -.005em; margin: 0; }
    .admin-card-h p { color: var(--fg-mute); font-size: 14px; line-height: 1.5; margin: 5px 0 0; max-width: 64ch; }
    .admin-card-b { padding: 4px 24px 8px; border-top: 1.5px solid var(--line); }
    /* SOW-070: today's sections become SUB-SECTIONS nested inside the parent cards (divided, like Settings rows). */
    .admin-sub { padding: 18px 0; border-top: 1px solid var(--line); }
    .admin-sub:first-child { border-top: 0; }
    .admin-sub-h { font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: -.005em; margin: 0 0 12px; }
    /* SOW-070: SUB-SECTION NAVIGATION -- a row of sub-tabs switches between the parent groups (one shown at a time). */
    @media (max-width: 760px) { .admin-tabs button { font-size: 12.5px; padding: 8px 10px; } }
    .admin-tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 1720px; margin: 0 auto 22px; padding: 6px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,.05); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }
    .admin-tabs { flex-wrap: wrap; }
    .admin-tab { flex: 1 1 auto; white-space: nowrap; font: inherit; font-weight: 600; font-size: 13.5px; padding: 9px 13px; border: 0; border-radius: 9px; background: transparent; color: var(--fg-mute); cursor: pointer; transition: color .14s ease, background .14s ease; }
    .admin-tab:hover { color: var(--fg); }
    .admin-tab.on { background: var(--green); color: #fff; }
    [data-panel] { display: none; }
    [data-panel].on { display: block; }
    /* sow-228: the non-staff notice. `[hidden]` is asserted with !important because an explicit display on the
       element would otherwise beat the UA's [hidden]{display:none} and leak the denial to a legitimate admin. */
    [hidden] { display: none !important; }
    .admin-deny { max-width: 640px; margin: 24px auto; padding: 26px 28px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--paper); text-align: center; }
    .admin-deny h2 { font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: -.005em; margin: 0 0 10px; }
    .admin-deny p { color: var(--fg-mute); font-size: 14px; line-height: 1.55; margin: 0 0 8px; }
    .admin-deny a { color: var(--green); font-weight: 600; text-decoration: none; }
    .admin-deny a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="nt" data-shell>
    <main class="nt-main">
      <div class="nt-top" data-topbar>
        <div><h1 class="hub-h">Admin tools</h1><p class="hub-sub">Governance and moderation.</p></div>
      </div>
      <!-- sow-228: shown only when the role resolves BELOW moderator. Never shown while the role is still
           unresolved, so a legitimate admin does not see a denial flash on a slow status call. -->
      <div class="admin-deny" data-admin-deny hidden>
        <h2>These tools are for moderators and above</h2>
        <p>Your account is signed in, but it does not carry a staff role, so there is nothing to show here.
          If you believe that is wrong, ask a superadmin to check your role.</p>
        <p><a href="newtab.html">Back to the feed</a></p>
      </div>
      <!-- sow-228: INERT until cloned by admin.mjs for a resolved staff role. Nothing in here renders, upgrades,
           or issues a request for a non-staff visitor. A NEW PANEL GOES INSIDE THIS TEMPLATE. -->
      <template data-admin-panels>
      <div class="admin-tabs" role="tablist">
        <button class="admin-tab on" type="button" data-tab="members">Members</button>
        <button class="admin-tab" type="button" data-tab="moderation">Moderation</button>
        <button class="admin-tab" type="button" data-tab="categories">Categories</button>
        <button class="admin-tab" type="button" data-tab="tags">Tags</button>
        <button class="admin-tab" type="button" data-tab="news">News sources</button>
        <button class="admin-tab" type="button" data-tab="quotes">Quotes</button>
        <button class="admin-tab" type="button" data-tab="coupons">Coupons</button>
        <button class="admin-tab" type="button" data-tab="syndication">Syndication</button>
      </div>
      <div class="admin-col">
        <section class="admin-card on" data-panel="members">
          <div class="admin-card-h"><h2>Members</h2><p>The member roster. Manage a member's ban, grandfather, or role from their row.</p></div>
          <div class="admin-card-b">
            <div class="admin-sub"><gbti-superadmin-dashboard></gbti-superadmin-dashboard></div>
          </div>
        </section>
        <section class="admin-card" data-panel="moderation">
          <div class="admin-card-h"><h2>Moderation</h2><p>Moderate content by path, and act on members or roles by github_id.</p></div>
          <div class="admin-card-b">
            <div class="admin-sub"><gbti-admin></gbti-admin></div>
          </div>
        </section>
        <section class="admin-card" data-panel="categories">
          <!-- SOW-100 responsive QA: the workspace carries its own header; the card header duplicated it and
               cost a full screen of copy on mobile. -->
          <div class="admin-card-b"><div class="admin-sub"><gbti-categories-workspace></gbti-categories-workspace></div></div>
        </section>
        <section class="admin-card" data-panel="tags">
          <div class="admin-card-h"><h2>Tags</h2><p>The free-form cross-cutting tags on posts, prompts, and products, aggregated from the live content indexes. Read-only; tag curation is a follow-up.</p></div>
          <div class="admin-card-b"><div class="admin-sub"><gbti-tag-explorer></gbti-tag-explorer></div></div>
        </section>
        <section class="admin-card" data-panel="news">
          <div class="admin-card-h"><h2>News sources</h2><p>The git-native news source pool. Edits open an auto-merged house PR.</p></div>
          <div class="admin-card-b"><div class="admin-sub"><gbti-news-source-manager></gbti-news-source-manager></div></div>
        </section>
        <section class="admin-card" data-panel="quotes">
          <div class="admin-card-h"><h2>Quotes</h2><p>The new-tab splash quotes. Edits open an auto-merged house PR.</p></div>
          <div class="admin-card-b"><div class="admin-sub"><gbti-quote-manager></gbti-quote-manager></div></div>
        </section>
        <section class="admin-card" data-panel="coupons">
          <!-- SOW-119: the coupon registry (git-native config) + KV usage + the shareable invite links. -->
          <div class="admin-card-h"><h2>Coupons</h2><p>Free-time signup codes: create and edit coupons, track redemptions, and manage the invite links. Config edits open an auto-merged house PR.</p></div>
          <div class="admin-card-b"><div class="admin-sub"><gbti-coupon-manager></gbti-coupon-manager></div></div>
        </section>
        <section class="admin-card" data-panel="syndication">
          <!-- SOW-088: the former Syndication (queue) + Channels tabs combined; the workspace nests the
               Publishing Activity kanban plus pipeline, per-channel templates, auto-share, and word lists. -->
          <div class="admin-card-h"><h2>Syndication</h2><p>Publishing activity, the pipeline, per-channel templates, news auto-share, and the moderation word lists.</p></div>
          <div class="admin-card-b"><div class="admin-sub"><gbti-channel-map-manager></gbti-channel-map-manager></div></div>
        </section>
      </div>
      </template>
    </main>
  </div>
  <script src="dist/admin.js"></script>
</body>
</html>
