# Grandfathered github_ids (ADMIN-owned; see CODEOWNERS). A grandfather grant makes a github_id
# count as PAID with no Stripe subscription. Permanent by default; set `until` for a time-boxed
# grant. Precedence: ban > staff > grandfather > Stripe.
# Complimentary, permanent access for the existing co-op members (predate the paid system). The two
# superadmins (atwellpub, gbtilabs) are NOT listed: staff already outranks Stripe (ban > staff > grandfather).
#
# sow-185: an optional `tier:` field sets the membership TIER a grant confers, so a superadmin (admin+) can
# comp any account at a specific level by editing this file (superadmin edits auto-merge per SOW-108). Allowed
# values: `member` (Network Member) or `creator` (Content Creator). A grant with NO `tier` defaults to
# `member` (owner decision Q15, 2026-08-18, flipped from creator): a tierless comp reads as Network Member, so
# an entry that should keep Content Creator access MUST carry an explicit `tier: creator`. Free
# access is the absence of a grant; deplatforming is a ban (house/bans.yml), never a tier here.
#
# EVERY entry carries an EXPLICIT tier (owner decision, 2026-08-21). Do not add a bare entry and rely on the
# default. The point is not behaviour, which is identical either way, it is that a future change to
# grantTier's default then produces a visible diff per person instead of silently moving everyone on one
# line. That silent movement happened on 2026-08-18 and ran for two days before anyone noticed.
