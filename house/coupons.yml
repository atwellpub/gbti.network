# SOW-119: the coupon registry (ADMIN-owned; see CODEOWNERS). A coupon grants a redeeming signup
# `freeDays` of effective-paid time: the signup Worker records the redemption in KV, and the daily
# reconcile folds it into house/grandfathered.yml as an `until`-bounded grant
# (reason: coupon:<CODE>). At expiry the standard lapse machinery runs; checkout is the way back in.
#
# Mirrored to the KV key `coupons:config` by reconcile + sync-overrides-mirror, so the Worker
# validates codes against live values without a redeploy. This file carries no secrets.
#
# Fields: code (3-32 chars A-Z 0-9, case-insensitive at entry), freeDays (1-3650), active,
# tier (member | creator; REQUIRED while active, see the ruling below), note, maxRedemptions
# (optional; null = unlimited), expiresAt (optional ISO date; the coupon's own shelf life, not
# the grant length).
# OWNER RULING 2026-08-11, recorded so it is not re-litigated or "fixed" by a later reader.
#
# UNCAPPED AND NON-EXPIRING IS DELIBERATE. `maxRedemptions: null` and `expiresAt: null` are a decision, not
# an oversight. SecurityMaster raised that the code is published on a public page AND in this public repo, so
# the real audience is anyone who finds it rather than the named cohort. The owner accepted that and chose
# MANUAL moderation over an artificial cap, reasoning that a cap set below the real cohort silently breaks
# the campaign.
#
# THE CONTROL IS THE NOTIFICATION, AND SINCE 2026-08-26 IT EXISTS AND IS ARMED.
#
# History, kept because the gap was real and the dates matter. From the 2026-08-11 ruling until 2026-08-25
# there was NO control at all: `redeemCoupon` sent nothing, and every redemption of an uncapped, non-expiring,
# publicly published free-year code was silent. Manual moderation had replaced the cap, and manual moderation
# is impossible without the signal it depends on.
#
# Built as sow-279 and deployed 2026-08-25 (`3518ade0`). It stayed INERT for another day, because it is
# fail-soft and no recipient was set, so the repository looked armed while production was not. The owner chose
# `opportunities@gbti.network` on 2026-08-26 and it is committed as `COUPON_ALERT_EMAIL` in
# `[env.production.vars]` of `workers/signup/wrangler.toml`, deployed in Worker version `a6dad01f`. It was
# verified ON THE DEPLOYED VERSION rather than in the repository, because a committed var is not a live var.
#
# WHAT IT SENDS: one email per NEW redemption, carrying the code, the campaign, the member login and
# github_id, the tier and grant end, and the redemption timestamp. It fires once per member, on the GitHub
# leg only.
#
# IT NOW FAILS LOUDLY, which it did not at first, and the way it failed is worth keeping. The requirement
# below has always said this notice must log and surface a failure, because it is the ONLY control here rather
# than one of several. As built it swallowed the error and returned a result the caller discards: the Worker
# fires it through `ctx.waitUntil` and never reads the resolved value, so a send that Resend rejected produced
# no email, no log and no trace. From the outside that is indistinguishable from a code nobody redeemed, which
# is the exact state this notice exists to end. Fixed 2026-08-26 in `workers/signup/coupon-alert.mjs`: a
# failed send and an unconfigured alarm both warn, naming the code and the github_id, and success stays silent
# so a warning always means something. Covered by tests in `test/coupon-alert.test.mjs` that were run against
# the previous version first and failed there.
#
# THE RUNNING REDEMPTION COUNT IS NOW CARRIED, as the requirement below asks. Every notice reads
# `Total: N redemptions of this code, including this one`, so a burst is legible from one email instead of by
# counting an inbox. `redeemCoupon` returns the post-increment count on the grant and the notice projects it.
#
# A CORRECTION, kept because the reasoning was wrong and not just the conclusion. On 2026-08-26 this file said
# adding the count "means a KV read on the signup completion path. That is a design decision". It is not: the
# read was already there. `redeemCoupon` reads that same counter to enforce `maxRedemptions` and writes it
# back, so the number was in scope eleven lines above the return the whole time. A cost was asserted from the
# shape of the problem instead of read off the code, and it deferred a requirement for a day on that basis.
#
# The read-then-write around the counter is NOT atomic, and deliberately still is not. That is the same
# non-atomic pair that already governs cap enforcement, so under simultaneous redemptions the number in one
# email can lag by one. The emails are the record; the count is a reading aid. Do not use it for a cap
# decision, and do not "fix" the atomicity for the sake of this line.
#
# IT IS PROBED WEEKLY, so it cannot go quietly dead again. `credential-health.yml` (Mondays 13:23 UTC) calls
# `sendCouponRedemptionAlert` itself, not a copy, and sends one real email subject-prefixed
# `[alarm self-test]`. A rotated Resend key, an unverified sender domain or a broken address now goes red and
# emails the owner BEFORE a redemption rather than after one was missed. Two limits worth knowing rather than
# discovering: it sends a real email every week, and it reads the recipient from `[env.production.vars]` in
# `workers/signup/wrangler.toml`, so it proves the COMMITTED address works and cannot prove the Worker was
# deployed since. That second gap is exactly what kept this alarm inert on 2026-08-25, so verify a deploy with
# `npx wrangler versions view <id> --env production`, never with a green run here.
#
# AND IT HAS NEVER FIRED ON A REAL REDEMPTION. The send path is complete and every input is present on
# production, but no coupon has been redeemed since it was armed, so the end-to-end path is proven only by
# unit tests. Treat the first real redemption as the live test.
#
# THE STANDING REQUIREMENT, unchanged: it must fail LOUDLY (log plus a surfaced failure), not best-effort like
# an ordinary nice-to-have email, precisely because it is the only control rather than one of several. It needs
# enough detail to spot an abusive pattern: code, github_id, timestamp, and the running redemption count.
#
# Owner: this is no longer the gap to weigh when deciding how long to leave the codes uncapped. The signal now
# exists. What remains open is how long uncapped is right, which is a separate ruling in `human-todo.md`.
#
# TIER IS EXPLICIT, NOT INHERITED. Do NOT rely on `grantTier`'s creator default to deliver it: that default
# exists to preserve legacy flat grants, and leaning on it means the tier is re-decided implicitly on every
# future redemption. Write it into the fold.
#
# ENFORCED IN CODE 2026-08-12, so this is now a rule rather than a request. Each coupon carries a `tier`,
# `validateCoupons` REJECTS an active coupon that names none, the signup Worker stamps the tier into the KV
# redemption record, and the reconcile fold writes it into house/grandfathered.yml. The precedence when the
# fold plans a grant, highest first: a hand-set tier on an existing entry (an owner decision outranks a
# campaign), then the redemption record (what was promised when it was actually redeemed), then this file,
# then nothing.
#
# What this did NOT change: a tierless grant still resolves to creator downstream, so no live member's
# access moved. The fix is that the value is now RECORDED rather than re-derived, and a future change to
# `grantTier`'s default can no longer silently move everyone already folded.
#
# See `.data/ops/incident-ops/security-audit-2026-08-10.md` for the finding this ruling answers.

coupons:
  - code: CODEABLEYEAR
    freeDays: 365
    active: true
    tier: member
    note: Codeable experts, first year free (SOW-119)
    maxRedemptions: null
    expiresAt: null
  # sow-230: the LinkedIn intake. TIER IS `member`, NOT `creator`, and the difference is the whole reason
  # this entry needs reading rather than copying. The owner asked for "the $50/yr membership", and
  # membership/tiers.mjs:17 records member as $5 monthly / $50 annual against creator at $15 / $150. So the
  # two live campaigns now confer DIFFERENT tiers from the same mechanism, and the landing page copy is where
  # that goes wrong: the Codeable page calls its grant "the network's top tier", which is true of creator and
  # false of member. Copying that page without moving its tier constants would advertise the wrong tier at
  # the wrong price while granting the right one.
  #
  # UNCAPPED AND SHARED, by owner decision, the same posture as CODEABLEYEAR and consistent with their
  # 2026-08-11 ruling that manual moderation beats an artificial cap. The gap named at the top of this file
  # applies here with a LARGER blast radius: CODEABLEYEAR faces a bounded professional network, this faces
  # LinkedIn. Same zero control, bigger and more public audience. Lower value per redemption ($50 rather than
  # $150), plausibly much higher volume.
  - code: LINKEDINCONNECT
    freeDays: 365
    active: true
    tier: member
    note: LinkedIn intake, first year free (sow-230)
    maxRedemptions: null
    expiresAt: null
  # sow-230: the owner's personal invite code, same terms and the same member tier as LINKEDINCONNECT, and
  # it points at the same lander (/member-invite/?coupon=HUDSINVITE). It exists so a hand-issued invite is
  # DISTINGUISHABLE FROM the LinkedIn campaign at redemption: both write `reason: coupon:<CODE>` into
  # house/grandfathered.yml, so a separate code is the only thing that later says which route a member came
  # in by. Two codes are also two things to retire independently.
  #
  # TIER IS `member`, matching the lander it is sent with. A creator-tier invite belongs on
  # /curator-invite/ with a creator-tier code; sending a member code to a creator lander (or the reverse) is
  # the defect that produced the /linkedin-invite/ retirement, so the pairing is not cosmetic.
  #
  # Uncapped and non-expiring like its siblings, which means the notification gap at the top of this file
  # applies to it too. This one is lower risk in practice because it is issued by hand to named people
  # rather than published, but nothing in the code enforces that: it is a bearer code like any other, and a
  # forwarded link is a transferred free year.
  - code: HUDSINVITE
    freeDays: 365
    active: true
    tier: member
    note: Owner personal invites, first year free (sow-230)
    maxRedemptions: null
    expiresAt: null
