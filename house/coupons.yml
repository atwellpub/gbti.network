# SOW-119: the coupon registry (ADMIN-owned; see CODEOWNERS). A coupon grants a redeeming signup
# `freeDays` of effective-paid time: the signup Worker records the redemption in KV, and the daily
# reconcile folds it into house/grandfathered.yml as an `until`-bounded grant
# (reason: coupon:<CODE>). At expiry the standard lapse machinery runs; checkout is the way back in.
#
# Mirrored to the KV key `coupons:config` by reconcile + sync-overrides-mirror, so the Worker
# validates codes against live values without a redeploy. This file carries no secrets.
#
# Fields: code (3-32 chars A-Z 0-9, case-insensitive at entry), freeDays (1-3650), active,
# tier (member | creator; REQUIRED while active, see the ruling below), note, maxRedemptions
# (optional; null = unlimited), expiresAt (optional ISO date; the coupon's own shelf life, not
# the grant length).
# OWNER RULING 2026-08-11, recorded so it is not re-litigated or "fixed" by a later reader.
#
# UNCAPPED AND NON-EXPIRING IS DELIBERATE. `maxRedemptions: null` and `expiresAt: null` are a decision, not
# an oversight. SecurityMaster raised that the code is published on a public page AND in this public repo, so
# the real audience is anyone who finds it rather than the named cohort. The owner accepted that and chose
# MANUAL moderation over an artificial cap, reasoning that a cap set below the real cohort silently breaks
# the campaign.
#
# THE CONTROL IS THE NOTIFICATION, AND AS OF 2026-08-11 THAT NOTIFICATION DOES NOT EXIST.
#
# Corrected 2026-08-11 (SecurityMaster, after OnboardingMaster's pre-flight found it via SowMaster). The
# first version of this note asked for the redemption email to be HARDENED so it fails loudly instead of
# silently. That was wrong in the direction that matters: `opportunities@gbti.network` appears nowhere in the
# codebase, `workers/signup/coupons.mjs` has no notification path, and `redeemCoupon` sends nothing. Every
# redemption today is silent.
#
# So the state is not "a weak control". It is NO CONTROL. The owner's ruling replaced the redemption cap with
# manual moderation, and manual moderation is impossible without the signal it depends on. Until the
# notification is built, an uncapped, non-expiring, publicly published free-year code has nothing watching it.
#
# WHEN IT IS BUILT, it must fail LOUDLY (log plus a surfaced failure), not best-effort like an ordinary
# nice-to-have email, precisely because it is the only control rather than one of several. It needs enough
# detail to spot an abusive pattern: code, github_id, timestamp, and the running redemption count.
#
# Owner: this is the gap to weigh when deciding how long to leave the codes uncapped. Tracked with
# @OnboardingMaster, who holds the build.
#
# TIER IS EXPLICIT, NOT INHERITED. Do NOT rely on `grantTier`'s creator default to deliver it: that default
# exists to preserve legacy flat grants, and leaning on it means the tier is re-decided implicitly on every
# future redemption. Write it into the fold.
#
# ENFORCED IN CODE 2026-08-12, so this is now a rule rather than a request. Each coupon carries a `tier`,
# `validateCoupons` REJECTS an active coupon that names none, the signup Worker stamps the tier into the KV
# redemption record, and the reconcile fold writes it into house/grandfathered.yml. The precedence when the
# fold plans a grant, highest first: a hand-set tier on an existing entry (an owner decision outranks a
# campaign), then the redemption record (what was promised when it was actually redeemed), then this file,
# then nothing.
#
# What this did NOT change: a tierless grant still resolves to creator downstream, so no live member's
# access moved. The fix is that the value is now RECORDED rather than re-derived, and a future change to
# `grantTier`'s default can no longer silently move everyone already folded.
#
# See `.data/ops/incident-ops/security-audit-2026-08-10.md` for the finding this ruling answers.

coupons:
  - code: CODEABLEYEAR
    freeDays: 365
    active: true
    tier: creator
    note: Codeable experts, first year free (SOW-119)
    maxRedemptions: null
    expiresAt: null
  # sow-230: the LinkedIn intake. TIER IS `member`, NOT `creator`, and the difference is the whole reason
  # this entry needs reading rather than copying. The owner asked for "the $50/yr membership", and
  # membership/tiers.mjs:17 records member as $5 monthly / $50 annual against creator at $15 / $150. So the
  # two live campaigns now confer DIFFERENT tiers from the same mechanism, and the landing page copy is where
  # that goes wrong: the Codeable page calls its grant "the network's top tier", which is true of creator and
  # false of member. Copying that page without moving its tier constants would advertise the wrong tier at
  # the wrong price while granting the right one.
  #
  # UNCAPPED AND SHARED, by owner decision, the same posture as CODEABLEYEAR and consistent with their
  # 2026-08-11 ruling that manual moderation beats an artificial cap. The gap named at the top of this file
  # applies here with a LARGER blast radius: CODEABLEYEAR faces a bounded professional network, this faces
  # LinkedIn. Same zero control, bigger and more public audience. Lower value per redemption ($50 rather than
  # $150), plausibly much higher volume.
  - code: LINKEDINCONNECT
    freeDays: 365
    active: true
    tier: member
    note: LinkedIn intake, first year free (sow-230)
    maxRedemptions: null
    expiresAt: null
  # sow-230: the owner's personal invite code, same terms and the same member tier as LINKEDINCONNECT, and
  # it points at the same lander (/member-invite/?coupon=HUDSINVITE). It exists so a hand-issued invite is
  # DISTINGUISHABLE FROM the LinkedIn campaign at redemption: both write `reason: coupon:<CODE>` into
  # house/grandfathered.yml, so a separate code is the only thing that later says which route a member came
  # in by. Two codes are also two things to retire independently.
  #
  # TIER IS `member`, matching the lander it is sent with. A creator-tier invite belongs on
  # /curator-invite/ with a creator-tier code; sending a member code to a creator lander (or the reverse) is
  # the defect that produced the /linkedin-invite/ retirement, so the pairing is not cosmetic.
  #
  # Uncapped and non-expiring like its siblings, which means the notification gap at the top of this file
  # applies to it too. This one is lower risk in practice because it is issued by hand to named people
  # rather than published, but nothing in the code enforces that: it is a bearer code like any other, and a
  # forwarded link is a transferred free year.
  - code: HUDSINVITE
    freeDays: 365
    active: true
    tier: member
    note: Owner personal invites, first year free (sow-230)
    maxRedemptions: null
    expiresAt: null
