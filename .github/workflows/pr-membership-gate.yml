name: PR membership gate

# SOW-005 PR-gate: the required status check that decides whether a content PR may merge.
#
# THE ONE RULE THAT MUST NEVER BE BROKEN:
#   Never check out or execute untrusted PR code in this workflow.
# This workflow runs on `pull_request_target`, so it executes the BASE branch's workflow (a PR
# cannot alter the gate that judges it) and it holds secrets (Stripe read-only key, GitHub
# content-write token). The gate reads ONLY PR metadata (author github_id, changed file paths via
# the API). actions/checkout below has NO `ref:` override, so it checks out the BASE branch, never
# `github.event.pull_request.head`. Do not add a ref that points at the PR head, and do not run any
# script, build step, or install hook from the PR's tree. Violating this leaks every secret and
# defeats every other access-control layer. See .data/specs/roles-and-capabilities.md.
#
# Trigger split (review hardening #4): the secret-free content/media validation runs on
# `pull_request` (see content-check.yml, media-check.yml); ONLY this metadata gate runs on
# `pull_request_target` with secrets. "Require approval to run workflows on fork PRs" applies to
# this workflow alone.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  # An owner accepts a contribution by submitting an approving review. Re-run the gate on review
  # events so the contribution check flips green once the owner has approved on the current head.
  pull_request_review:
    types: [submitted, dismissed]

# The gate (using the bot token) writes the commit status + label and auto-closes non-member PRs.
# These permissions cover the workflow GITHUB_TOKEN as a floor; the bot PAT does the actual writes.
permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  membership-gate:
    runs-on: ubuntu-latest
    steps:
      # Checks out the BASE branch (no ref override = the base of the pull_request_target event).
      # We need the base branch's scripts and the base copy of house/*.yml (the overrides), never
      # the PR head.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # This job holds Stripe + GitHub secrets, and the gate code imports only membership/*, clients/*,
      # and js-yaml. Install with no lifecycle scripts and no optional native deps (sharp) to keep the
      # supply-chain surface next to the secrets as small as possible.
      - run: npm ci --ignore-scripts --omit=optional

      - name: Run the membership gate (metadata only)
        run: node scripts/pr-gate.mjs
        env:
          # The content-write token is a fine-grained PAT for the gbtilabs superadmin (automation runs as
          # gbtilabs), passed under its own name, never aliased onto the conventional GITHUB_TOKEN. The Actions
          # SECRET is named GH_BOT_TOKEN because GitHub forbids any secret/variable name starting with GITHUB_;
          # it is injected into the unrestricted env var GITHUB_BOT_TOKEN that the scripts read.
          GITHUB_BOT_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          # GITHUB_CONTENT_REPO is a non-secret constant (and could not be a GITHUB_-prefixed secret anyway):
          GITHUB_CONTENT_REPO: gbti-network/gbti.network
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          # sow-185 FAIL-OPEN FIX (2026-08-11, SecurityMaster). These price ids were provisioned in
          # workers/signup/wrangler.toml [env.production.vars] but were NEVER passed to this workflow, so
          # buildEnvPriceTierMap(process.env) built an EMPTY map here and tierForPrice() fell through to its
          # legacy single-price branch, returning `creator` for EVERY paid subscriber. meetsTier() then passed,
          # so a $5 Network Member was admitted wherever Content Creator was required. Reconcile was unaffected
          # because shouldSyncCreatorRole() guards on the map being non-empty; this gate had no such guard.
          # These are PUBLIC, non-secret Stripe price ids (they already sit in a committed wrangler.toml), so
          # they are inlined here rather than held as secrets, exactly like STRIPE_PRICE_ID's siblings.
          # Keep in sync with wrangler.toml [env.production.vars].
          STRIPE_PRICE_ID: price_1Tg5NHBFxyhSkuibXFrQyqaN
          STRIPE_PRICE_MEMBER_MONTHLY: price_1U2d31BFxyhSkuibpiaNGku5
          STRIPE_PRICE_MEMBER_ANNUAL: price_1U2d31BFxyhSkuibfNpQKcX0
          STRIPE_PRICE_CREATOR_MONTHLY: price_1U2d32BFxyhSkuibQJHXnU3F
          STRIPE_PRICE_CREATOR_ANNUAL: price_1U2d32BFxyhSkuibPBqOdOZs
          # BOT_GITHUB_ID = the GBTI App bot (gbti-network-publisher[bot]) that opens member authoring PRs on the
          # member's behalf (SOW-026). The gate uses it to detect an App-opened PR and resolve the REAL author from
          # the head-fork owner (a member can only open a PR from their own fork). It is NOT a superadmin id, so the
          # isBot admin-floor never triggers for it. Without this, every extension-authored PR (comments + content)
          # is rejected as "not a member" and auto-closed.
          BOT_GITHUB_ID: ${{ vars.BOT_GITHUB_ID }}
          # sow-213: the gate reads bans and grandfather grants from the KV overrides mirror as well as from
          # house/*.yml, and requires the two to AGREE. Those records are person-keyed data about real people
          # and are moving out of this public, forkable, CDN-cached repo into KV; this is the step that teaches
          # the gate the new source while the git files are still authoritative.
          #
          # MODE IS DERIVED FROM REALITY, NOT FROM A FLAG. With the files present and these three set, the mode
          # is 'both': read both, and a DIVERGENCE, an unreadable mirror or one older than 48h all DENY. Once
          # Phase 3 removes the files the same code resolves to 'kv' with no fallback, so the act of removing
          # them is the act that closes the fallback. There is nothing to remember later.
          #
          # THIS TOKEN IS READ-ONLY AND IS NOT CF_API_TOKEN. CF_API_TOKEN is Workers KV Storage:EDIT and
          # non-expiring; it must never be used here. This job runs on pull_request_target, so a KV-WRITE
          # credential in it would trade away the property that makes holding secrets here acceptable at all.
          # CF_KV_READ_TOKEN expires 2027-08-28 by design: Cloudflare's KV permission is account-level with no
          # per-namespace selector, so where scope cannot confine a credential, time does. See
          # .data/ops/secrets-ops/README.md.
          #
          # The account and namespace ids are non-secret identifiers (acting on them requires the token), so
          # they are inlined exactly as in sync-overrides-mirror.yml and reconcile.yml.
          CF_ACCOUNT_ID: "d42b12e969229c5187ad0f7289536487"
          CF_KV_NAMESPACE_ID: "49432379e11844ac81b6fdaf22d3937a"
          CF_API_TOKEN: ${{ secrets.CF_KV_READ_TOKEN }}
