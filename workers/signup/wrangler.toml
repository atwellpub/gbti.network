STRIPE_PRICE_MEMBER_MONTHLY = "price_1U2d31BFxyhSkuibpiaNGku5"
STRIPE_PRICE_MEMBER_ANNUAL = "price_1U2d31BFxyhSkuibfNpQKcX0"
