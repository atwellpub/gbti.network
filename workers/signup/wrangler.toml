# SOW-087: Workers AI for production (no inheritance from the top-level [ai]).
[env.production.ai]
binding = "AI"

# SOW-061: the Analytics Engine dataset for production (wrangler does not inherit top-level bindings into named envs).
[[env.production.analytics_engine_datasets]]
