# Cloudflare Worker config for the GBTI Network signup surface (SOW-002).
# This is the only always-on surface: GitHub + Discord OAuth, Stripe Customer creation, the trial
# Discord role, checkout, and the optional Stripe webhook. Deploy with `npx wrangler deploy`.
#
# Local dev: `npx wrangler dev` reads .dev.vars (copy .dev.vars.example to .dev.vars and fill it in).
# Wrangler picks its own local port, so there is no bind port to free here.
#
# Secrets (Stripe key, OAuth client secrets, bot token, session secret, dispatch token, Turnstile
# secret) are NEVER committed. Set them with `npx wrangler secret put <NAME>` for production and via
# .dev.vars for local dev. The [vars] block below holds only non-secret configuration placeholders.

name = "gbti-signup"
main = "index.mjs"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# SOW-124: retain Worker logs (the wlog() diagnostic lines + the console.error paths) in the Cloudflare
# dashboard, not only via a live `wrangler tail`. Mirrors workers/news. head_sampling_rate=1 keeps all traces
# (this Worker's request volume is low). Re-declared under [env.production] because wrangler does not inherit.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
# Public origin of this Worker (no trailing slash). Used to build OAuth redirect URIs and the
# checkout return URLs.
PUBLIC_BASE_URL = "https://signup.gbti.network"
SITE_BASE_URL = "https://gbti.network"   # the apex website; post-signup/checkout/connect redirects land HERE (the /account page lives on the site, not the Worker)
# SOW-166 envelope From for BOTH the digest send and the double-opt-in confirmation. NOT a secret; it is the
# address recipients see. It must be on the Resend-verified sending domain (gbti.network, subdomain-envelope
# setup via send.gbti.network) or Resend rejects the send. mail-drain.mjs falls back to RESEND_FROM if this is
# unset, but mail-subscribe.mjs does NOT: with MAIL_FROM missing, a subscriber is written as pending and the
# confirmation email never goes out, so the opt-in silently never completes.
MAIL_FROM = "GBTI Network <noreply@gbti.network>"
# SOW-166 digest rate caps (owner ruling 2026-08-22). PLAIN NUMBERS, not secrets: reviewable + tunable here
# without a code change. mail-drain.mjs ALSO carries bounded code defaults (MAIL_CAP_DEFAULTS) so an unset var can
# never mean unbounded; these are the tuning knobs, the code default is the correctness floor. Sized under
# Resend's free tier (100/day, 3,000/month) with retry headroom. Set MAIL_DAILY_CAP = "0" to pause all sends.
MAIL_DAILY_CAP = "90"
MAIL_MONTHLY_CAP = "2500"
MAIL_MAX_PER_TICK = "10"
# sow-158 Phase 1b: origins allowed to make CREDENTIALED (cookie) calls to the member endpoints (comma-separated,
# no trailing slash). Shared by the CORS reflect-origin policy AND the CSRF Origin check. A local dev host adds
# http://localhost:4321 via .dev.vars; keep this tight (never a wildcard, which cannot co-exist with credentials).
CORS_ALLOWED_ORIGINS = "https://gbti.network"

# Discord guild + role ids (non-secret, but environment-specific).
DISCORD_GUILD_ID = "1073029070411006053"
DISCORD_TRIAL_ROLE_ID = "1511800465107583198"
DISCORD_MEMBER_ROLE_ID = "1511810502970441900"
# SOW-011 lockout role: a lapsed/banned account is moved here (its channel overwrites deny the community
# channels; reconcile never kicks). The bot role must sit ABOVE this role.
DISCORD_LOCKED_ROLE_ID = "1512558475341987990"
# sow-185/sow-218: the STACKABLE Content Creator badge (a creator holds Member AND Creator). Already provisioned
# for reconcile in .github/workflows/reconcile.yml; signup needs it too, or a Codeable invitee has to wait for the
# next daily run to be badged. Separate axis from the exclusive access role above; the swap never strips it.
DISCORD_CREATOR_ROLE_ID = "1536102140802633788"
# On-demand invite: the channel the bot mints an invite to (#welcome). The bot needs CREATE_INSTANT_INVITE on it.
DISCORD_INVITE_CHANNEL_ID = "1073029071602204804"
# Static fallback invite (a real, permanent, unlimited-use invite) used only when the bot mint fails. The
# guild has no vanity URL, so this must be a minted code, not discord.gg/gbti-network.
DISCORD_INVITE_URL = "https://discord.gg/cCs952QJJs"

# Stripe annual price id ($150/yr). Non-secret. SANDBOX price; override in [env.production] with the live price.
STRIPE_PRICE_ID = "price_1TeI3RBUci7L4JnwPYzZfspC"

# OAuth public client ids (the secrets are set via `wrangler secret put`).
GITHUB_OAUTH_CLIENT_ID = "Ov23liG561w3RA8gPSJN"
DISCORD_OAUTH_CLIENT_ID = "1511795875788357632"

# SOW: device-flow GitHub App client id for the /auth/refresh endpoint (the App the EXTENSION signs in with,
# `gbti-network-publisher`). Public (no secret in the client id). The paired GITHUB_PUBLISHER_CLIENT_SECRET is a
# SECRET set via `wrangler secret put`. Override the sandbox value in [env.production.vars] if the App differs.
GITHUB_PUBLISHER_CLIENT_ID = "Iv23lis8jbx62zI7cwE8"

# Public content repo ("owner/name") for the re-gate / disable dispatch (SOW-005 signal).
GITHUB_CONTENT_REPO = "gbti-network/gbti.network"

# SOW-026 GitHub App PR-opener (non-secret). The canonical repo a member forks; the Worker opens the publish PR
# into it with GBTI's App installation token. The App id + installation id + private key are SECRETS, set via
# `wrangler secret put GITHUB_APP_ID` / `GITHUB_APP_INSTALLATION_ID` / `GITHUB_APP_PRIVATE_KEY` (see human-todo).
# Until they are set, POST /membership/open-pr returns "misconfigured" and the client stays on classic OAuth.
UPSTREAM_REPO = "gbti-network/gbti.network"

# SOW-007 referral feature switch for the Worker. Mirror house/referral-config.yml `enabled` here: keep
# "false" until referral payouts go live, which keeps the Connect onboarding routes dark (they return
# referral_disabled). Attribution (capturing ?ref at signup) is always on and harmless from launch.
REFERRAL_ENABLED = "false"

# SOW-156/157: hosted authoring. When "true", POST /membership/author lets a paid member (no fork, no App
# install) publish own-folder content through the Worker, which commits to a hosted/<github_id>/<itemId>
# branch on the canonical repo and opens the auto-merging PR (the SOW-005 gate stays the only merger).
# STANDING ON since the SOW-157 rollout (hosted is the new-member default); "false" only kills the switch.
MEMBERSHIP_AUTHOR_ENABLED = "true"

# SOW-016 member-content encryption epoch id (non-secret). Identifies the current epoch key the server-side
# POST /membership/decrypt + /membership/encrypt endpoints use (the SOW-015 GET /membership/key handout was
# retired; the key never leaves the Worker). Bump it when rotating the key (set the matching MEMBER_CONTENT_KEY
# secret in lockstep; see .data/ops/encryption-ops/rotation-runbook.md).
MEMBER_CONTENT_KID = "1"

# UnifiedWorker: the news ingest engine (folded in from the retired gbti-news worker) reads these each cron. AI is
# the shared Workers AI binding above; NEWS_SOURCES_URL is the public source-pool artifact the site publishes.
AI_MODEL = "@cf/meta/llama-3.2-3b-instruct"
SOURCE_CHUNK = "16"
RETENTION_DAYS = "30"
MAX_CLASSIFY = "16"
MAX_IMAGE_BACKFILL = "12"
NEWS_SOURCES_URL = "https://gbti.network/news-sources.json"

# KV namespace: github_id -> customer_id index, per-IP rate-limit records, and webhook event dedupe.
# Bind one namespace; the code namespaces keys by prefix (gh:, rl:signup:, evt:). Replace the id with
# the real namespace id from `npx wrangler kv namespace create SIGNUP_KV`.
STRIPE_PRICE_MEMBER_MONTHLY = "price_1U2cohBFxyhSkuibgPPLQwcZ"
STRIPE_PRICE_MEMBER_ANNUAL = "price_1U2cohBFxyhSkuibd0LmS1pk"
STRIPE_PRICE_CREATOR_MONTHLY = "price_1U2coiBFxyhSkuib4ZtpT0wA"
STRIPE_PRICE_CREATOR_ANNUAL = "price_1U2coiBFxyhSkuibudmNv19m"
[[kv_namespaces]]
binding = "SIGNUP_KV"
id = "49432379e11844ac81b6fdaf22d3937a"
preview_id = "09ca7e156ea04e62b9f4c8716e2a83c9"

# UnifiedWorker: the news collection (day-sharded feed:v2:* keys, the source-pool cache + cursor). SAME namespace
# the retired gbti-news worker used, so all existing news data is readable immediately with no migration.
[[kv_namespaces]]
binding = "NEWS_KV"
id = "64b09b4d03764c979447cc008ffe528c"
preview_id = "9abe9b8204b14c04b0a8f69f48a8545c"

# SOW-087: Workers AI for the share category suggestion (topic-suggest.mjs; one tiny classify call per
# composer URL preview, inside the free Neuron budget). Without this binding the suggester falls back to the
# free keyword match (fail-open, nothing breaks). Repeated under [env.production] (no inheritance).
[ai]
binding = "AI"

# SOW-061: Workers Analytics Engine dataset for extension usage by tier. Aggregate-only, no PII, no extra latency
# (writeDataPoint is fire-and-forget). recordUsage no-ops until this binding exists. Wrangler does NOT inherit
# bindings into named envs, so it is repeated under [env.production].
[[analytics_engine_datasets]]
binding = "EXT_ANALYTICS"
dataset = "gbti_ext_usage"

# THERE ARE DELIBERATELY NO CRONS IN THIS BARE CONFIG. The live crons are under [env.production.triggers].
#
# This block used to carry the same four crons as production, and because this bare config also binds the
# PRODUCTION SIGNUP_KV and NEWS_KV namespace ids (not the preview ones, see the kv_namespaces above), a
# `wrangler deploy` without `--env production` created a second Worker, `gbti-signup`, that ran all four
# scheduled jobs against LIVE data on the same schedule as production.
#
# It did exactly that, unnoticed, from 2026-07-09 until it was deleted on 2026-08-24. Two consequences, and
# the second is the serious one:
#   1. Every scheduled job ran twice. Cloudflare's own invocation counts showed the sandbox Worker firing
#      10 to 12 times an hour around the clock, and the duplicate KV traffic is what tripped the daily
#      operations alert.
#   2. It ran SIX-WEEK-OLD CODE against the live store. Everything landed after 2026-07-09 was absent from
#      it, including the fail-closed rate-cap floors, the mail-drain suppression defer, and the pending-index
#      three-state read. Two Workers were sweeping the same mail and syndication queues, one of them with the
#      old safety behaviour.
#
# So: do NOT add crons here. A sandbox Worker that shares production's KV must not also share its schedule.
# If you need to exercise a scheduled handler locally, use `wrangler dev --test-scheduled` and hit
# /__scheduled?cron=... , which needs no trigger declared, or add the cron temporarily and REMOVE IT before
# deploying anything.

# Secrets set out-of-band (wrangler secret put / .dev.vars), listed here for documentation only:
#   STRIPE_SECRET_KEY            restricted: create-customer + checkout only (least privilege)
#   STRIPE_WEBHOOK_SECRET        for the optional webhook signature verification
#   GITHUB_OAUTH_CLIENT_SECRET
#   GITHUB_PUBLISHER_CLIENT_SECRET  SOW: the gbti-network-publisher App's client secret, for POST /auth/refresh
#                                   (refreshes the extension's expiring user token). Until set, /auth/refresh
#                                   returns 501 and tokens just expire (the extension then forces re-sign-in).
#   DISCORD_OAUTH_CLIENT_SECRET
#   DISCORD_BOT_TOKEN            bot with Manage Roles; its role must sit above Trial + Member
#   SESSION_SECRET               HMAC key for the signed session + OAuth state
#   TURNSTILE_SECRET_KEY         Cloudflare Turnstile siteverify secret
#   REGATE_DISPATCH_TOKEN        GitHub token with repository_dispatch on the content repo
#   MEMBER_CONTENT_KEY           SOW-016: base64 of the 32-byte AES-256-GCM epoch key for the current
#                                MEMBER_CONTENT_KID. The key NEVER leaves the Worker: POST /membership/decrypt
#                                + POST /membership/encrypt use it server-side for an effective-paid caller
#                                (the SOW-015 GET /membership/key handout was retired). Mint with
#                                generateEpochKey() or `node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"`.
#   MEMBER_CONTENT_KEY_NEW       SOW-016 rotation: the NEXT epoch key, pre-generated + set before running the
#                                rotate-member-key workflow (so the new key is never echoed in CI logs).
#   MEMBER_CONTENT_KEYS          SOW-016 (optional): JSON map { "<kid>": "<base64 key>" } of retired epochs
#                                kept ONLY for the brief CDN-propagation overlap, then removed (the old key is
#                                destroyed so the old git-history ciphertext becomes keyless).
#   --- SOW-058 syndication channel secrets (each channel is SKIPPED until its secrets exist) ---
#   DISCORD_CHANNEL_POSTS/PRODUCTS/PROMPTS/SHARES  per-type channel ids the drain posts to (non-secret; may live
#                                in [vars]). MASTODON_BASE_URL + MASTODON_ACCESS_TOKEN; BLUESKY_HANDLE +
#                                BLUESKY_APP_PASSWORD; X_API_KEY/X_API_SECRET/X_ACCESS_TOKEN/X_ACCESS_SECRET;
#                                LINKEDIN_ACCESS_TOKEN + LINKEDIN_ORG_URN. Optional MAX_DRAIN_PER_TICK (default 10).
#
# The reconcile (scripts/reconcile.mjs) writes the overrides:mirror KV key this endpoint reads. It needs
# CF_ACCOUNT_ID / CF_KV_NAMESPACE_ID / CF_API_TOKEN in its OWN env (a GitHub Action secret, not a Worker
# secret) to PUT into this same SIGNUP_KV namespace. See .data/sow/human-todo.md.

# ===========================================================================
# PRODUCTION ENVIRONMENT  (deploy: `npx wrangler deploy --env production`)
# ---------------------------------------------------------------------------
# Wrangler does NOT inherit [vars] or [[kv_namespaces]] into a named environment, so the full set is
# redefined here. The values that differ from the sandbox default are the LIVE Stripe/Discord/OAuth ids:
# fill each PLACEHOLDER_LIVE_* before the production deploy (see .data/sow/launch-runbook.md).
#
# Secrets are a SEPARATE per-environment store: set each with `npx wrangler secret put <NAME> --env production`
# (so the live Stripe key, OAuth client secrets, bot token, SESSION_SECRET, TURNSTILE_SECRET_KEY,
# REGATE_DISPATCH_TOKEN, and MEMBER_CONTENT_KEY for production never collide with the sandbox set).
#
# Worker name: with `--env production` and no `name` override here, this deploys as `gbti-signup-production`.
# If production is meant to BE the canonical `gbti-signup` worker (and local dev uses `wrangler dev` rather
# than a deployed sandbox), set `name = "gbti-signup"` in this block. Left unset on purpose so the decision
# is explicit. The custom domain `signup.gbti.network` is attached to whichever worker is the production one.
[env.production.vars]
# Same in both environments (wrangler does NOT inherit top-level [vars] into named envs, so every var the
# Worker reads in production must be listed here):
PUBLIC_BASE_URL = "https://signup.gbti.network"
SITE_BASE_URL = "https://gbti.network"   # the apex website; post-signup/checkout/connect redirects land HERE (the /account page lives on the site, not the Worker)
# SOW-166 envelope From, digest + confirmation. Must be on the Resend-verified sending domain. mail-subscribe
# has no fallback for it, so an unset MAIL_FROM strands every opt-in as pending (see the [vars] note above).
MAIL_FROM = "GBTI Network <noreply@gbti.network>"
# SOW-166 digest rate caps (owner ruling 2026-08-22). Plain numbers, not secrets; the code carries bounded
# defaults (MAIL_CAP_DEFAULTS) so an unset var can never mean unbounded. Under Resend free tier with headroom.
MAIL_DAILY_CAP = "90"
MAIL_MONTHLY_CAP = "2500"
MAIL_MAX_PER_TICK = "10"
CORS_ALLOWED_ORIGINS = "https://gbti.network"   # sow-158 Phase 1b: credentialed-CORS + CSRF Origin allow-list (never a wildcard)
COOKIE_DOMAIN = "gbti.network"   # sow-158 web-login fix: scope the readable gbti_csrf cookie to the registrable domain so the static site (gbti.network) can read it while the Worker serves the OAuth callback from signup.gbti.network. Unset in dev = host-only.
GITHUB_CONTENT_REPO = "gbti-network/gbti.network"
REFERRAL_ENABLED = "true"            # SOW-059 ARMED: the Connect onboarding routes are live (mirrors referral-config.yml enabled)
TOUCH_CAPTURE_ENABLED = "true"       # SOW-059 ARMED: anonymous, consent-gated attribution capture + the conversion freeze are LIVE
MEMBER_CONTENT_KID = "1"
MEMBERSHIP_AUTHOR_ENABLED = "true"   # SOW-157 rollout: hosted authoring is the new-member default (proven live: PRs #171/#172)
UPSTREAM_REPO = "gbti-network/gbti.network"   # SOW-026: canonical repo the App opens PRs into
# UnifiedWorker: the news ingest engine (folded in) reads these each cron. The old NEWS_API_BASE HTTP hop +
# NEWS_API_KEY secret are gone (the news reads are in-process now); NEWS_CHANNELS below still drives the curator publish.
AI_MODEL = "@cf/meta/llama-3.2-3b-instruct"
SOURCE_CHUNK = "16"
RETENTION_DAYS = "30"
MAX_CLASSIFY = "16"
MAX_IMAGE_BACKFILL = "12"
NEWS_SOURCES_URL = "https://gbti.network/news-sources.json"
# SOW-046 C: the news-category -> Discord-channel map for the curator "Add to Discord" action, as a JSON string of
# house/news-channels.yml's shape ({ "channels": [{ "category": "ai", "channelId": "123..." }] }). Non-secret config.
# Empty (no channels) until the owner provisions the channel ids; an unmapped category posts nothing (fail-closed).
NEWS_CHANNELS = "{\"channels\":[{\"category\":\"ai/ml\",\"channelId\":\"1523419934338715720\"},{\"category\":\"devops/cloud\",\"channelId\":\"1074035726569701386\"},{\"category\":\"web dev\",\"channelId\":\"1074035726569701386\"},{\"category\":\"frameworks/libraries\",\"channelId\":\"1074035726569701386\"},{\"category\":\"programming languages\",\"channelId\":\"1074035726569701386\"},{\"category\":\"open source\",\"channelId\":\"1159535175219302480\"},{\"category\":\"security\",\"channelId\":\"1199744593546195024\"},{\"category\":\"hardware\",\"channelId\":\"1078549780394954773\"},{\"category\":\"blockchain\",\"channelId\":\"1523419333924098058\"},{\"category\":\"energy\",\"channelId\":\"1078551113487372328\"},{\"category\":\"business/funding\",\"channelId\":\"1078550840807260160\"}]}"
# LIVE-only values: fill before the production deploy.
STRIPE_PRICE_ID = "price_1Tg5NHBFxyhSkuibXFrQyqaN"            # the live $150/yr recurring price (prod_UfQDvczTRPCOOq)
GITHUB_OAUTH_CLIENT_ID = "Ov23li18yffp7NHSM6l6"
GITHUB_PUBLISHER_CLIENT_ID = "Iv23lis8jbx62zI7cwE8"           # SOW: the gbti-network-publisher App (same App in sandbox + prod) for /auth/refresh
DISCORD_OAUTH_CLIENT_ID = "1511795875788357632"
DISCORD_GUILD_ID = "1073029070411006053"
DISCORD_TRIAL_ROLE_ID = "1511800465107583198"
DISCORD_MEMBER_ROLE_ID = "1511810502970441900"
DISCORD_LOCKED_ROLE_ID = "1512558475341987990"
DISCORD_CREATOR_ROLE_ID = "1536102140802633788"   # sow-185/sow-218: the stackable Content Creator badge
DISCORD_INVITE_CHANNEL_ID = "1073029071602204804"
DISCORD_INVITE_URL = "https://discord.gg/cCs952QJJs"   # real permanent fallback invite (no guild vanity URL)
