# SOW-058: the syndication drain cron for production (wrangler does not inherit the top-level [triggers]).
[env.production.triggers]
# The two Tuesday entries are the SAME job: 7 AM America/Chicago is 12:00 UTC under daylight time and 13:00
# UTC under standard time, and cron here is UTC with no daylight handling. isCentralDigestHour (index.mjs)
# runs the compile on whichever one is the 07:00 hour today and no-ops the other. Do not "tidy" one away.
crons = ["*/5 * * * *", "0 * * * *", "30 * * * *", "0 12 * * 2", "0 13 * * 2"]

# SOW-124: retain production Worker logs in the dashboard (wrangler does not inherit the top-level block).
[env.production.observability]
enabled = true
head_sampling_rate = 1
